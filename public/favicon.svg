<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- Outer Dark Iron Casing with 3D Bevel -->
  <rect width="32" height="32" rx="3" fill="#0d1311"/>
  <rect x="1" y="1" width="30" height="30" rx="2" fill="#1b2520" stroke="#384c40" stroke-width="1"/>
  
  <!-- Top Bevel Highlight / Bottom Shadow -->
  <rect x="2" y="2" width="28" height="2" fill="#4a6254"/>
  <rect x="2" y="28" width="28" height="2" fill="#101714"/>
  <rect x="2" y="2" width="2" height="28" fill="#3a4d42"/>
  <rect x="28" y="2" width="2" height="28" fill="#121a15"/>

  <!-- Brass Rivets in 4 Corners -->
  <rect x="3" y="3" width="2" height="2" fill="#eab308"/>
  <rect x="3" y="3" width="1" height="1" fill="#fef08a"/>
  <rect x="27" y="3" width="2" height="2" fill="#eab308"/>
  <rect x="27" y="3" width="1" height="1" fill="#fef08a"/>
  <rect x="3" y="27" width="2" height="2" fill="#ca8a04"/>
  <rect x="3" y="27" width="1" height="1" fill="#fef08a"/>
  <rect x="27" y="27" width="2" height="2" fill="#ca8a04"/>
  <rect x="27" y="27" width="1" height="1" fill="#fef08a"/>

  <!-- Conveyor Track Slots (Horizontal Grips) -->
  <rect x="5" y="7" width="22" height="2" fill="#111614"/>
  <rect x="6" y="8" width="20" height="1" fill="#2d3c33"/>
  <rect x="5" y="23" width="22" height="2" fill="#111614"/>
  <rect x="6" y="24" width="20" height="1" fill="#2d3c33"/>

  <!-- The 6 Branch Color LEDs (Top 3, Bottom 3) -->
  <!-- Branch 1: Resources (Cyan) -->
  <rect x="8" y="3" width="3" height="2" fill="#38bdf8"/>
  <rect x="9" y="3" width="1" height="1" fill="#e0f2fe"/>
  <!-- Branch 2: Building (Orange) -->
  <rect x="14" y="3" width="4" height="2" fill="#fb923c"/>
  <rect x="15" y="3" width="2" height="1" fill="#ffedd5"/>
  <!-- Branch 3: Mechanics (Yellow) -->
  <rect x="21" y="3" width="3" height="2" fill="#eab308"/>
  <rect x="22" y="3" width="1" height="1" fill="#fef9c3"/>

  <!-- Branch 4: Power & AE2 (Red) -->
  <rect x="8" y="27" width="3" height="2" fill="#f87171"/>
  <rect x="9" y="27" width="1" height="1" fill="#fee2e2"/>
  <!-- Branch 5: Magic (Purple) -->
  <rect x="14" y="27" width="4" height="2" fill="#c084fc"/>
  <rect x="15" y="27" width="2" height="1" fill="#fae8ff"/>
  <!-- Branch 6: Bio (Green) -->
  <rect x="21" y="27" width="3" height="2" fill="#4ade80"/>
  <rect x="22" y="27" width="1" height="1" fill="#dcfce7"/>

  <!-- Central Kinetic Sorter Housing -->
  <rect x="7" y="10" width="18" height="12" rx="1" fill="#0c110f" stroke="#32453a" stroke-width="1"/>
  <rect x="9" y="11" width="14" height="10" fill="#131d18"/>

  <!-- Glowing Jev System 1 Diamond Sensor Core -->
  <polygon points="16,11 21,16 16,21 11,16" fill="#0284c7"/>
  <polygon points="16,12 20,16 16,20 12,16" fill="#38bdf8"/>
  <polygon points="16,14 18,16 16,18 14,16" fill="#e0f2fe"/>
  <rect x="15" y="15" width="2" height="2" fill="#ffffff"/>

  <!-- Sensor Crosshair Pulse Lines -->
  <rect x="8" y="15.5" width="2" height="1" fill="#38bdf8"/>
  <rect x="22" y="15.5" width="2" height="1" fill="#38bdf8"/>
</svg>
